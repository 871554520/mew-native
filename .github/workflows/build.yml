name: Build native macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".build-trigger"]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: 配置与编译（日志落盘）
        run: |
          set +e
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release > build.log 2>&1
          cmake --build build --parallel >> build.log 2>&1
          echo "build_rc=$?" >> build.log
          tail -40 build.log
      - name: 校验与打包
        run: |
          BIN=build/MewgenicsNative.app/Contents/MacOS/MewgenicsNative
          file "$BIN" >> build.log 2>&1
          codesign --force --deep --sign - build/MewgenicsNative.app >> build.log 2>&1
          ditto -c -k --sequesterRsrc --keepParent build/MewgenicsNative.app MewgenicsNative-mac.zip >> build.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            build.log
            MewgenicsNative-mac.zip
          if-no-files-found: warn
